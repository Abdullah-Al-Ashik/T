name: Threads publisher maintenance

on:
  schedule:
    - cron: '17 * * * *'   # Hourly, in UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threads-publisher-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            data
            src
            config.json
          sparse-checkout-cone-mode: true
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run maintenance dry run
        env:
          TRIGGERING_CRON: ${{ github.event.schedule }}
          PUBLIC_REPO_OWNER: ${{ github.repository_owner }}
          PUBLIC_REPO_NAME: ${{ github.event.repository.name }}
          PUBLIC_REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m src.main --dry-run
