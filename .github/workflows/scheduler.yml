name: Threads video publisher

on:
  schedule:
    # Times are in UTC. America/New_York schedule is managed in config.json;
    # the Python scheduler determines the correct local slot at runtime.
    # These cron entries approximate EST (UTC-5) to trigger near the right time.
    # During EDT (UTC-4) they fire ~1 hour late, but the scheduler handles it.
    - cron: '30 16 * * 1'   # Mon 11:30 ET
    - cron: '30 0 * * 2'    # Mon 19:30 ET (next day in UTC)
    - cron: '0 14 * * 2'    # Tue 09:00 ET
    - cron: '30 19 * * 2'   # Tue 14:30 ET
    - cron: '0 13 * * 3'    # Wed 08:00 ET
    - cron: '30 23 * * 3'   # Wed 18:30 ET
    - cron: '0 16 * * 4'    # Thu 11:00 ET
    - cron: '30 20 * * 4'   # Thu 15:30 ET
    - cron: '30 13 * * 5'   # Fri 08:30 ET
    - cron: '0 22 * * 5'    # Fri 17:00 ET
    - cron: '0 15 * * 6'    # Sat 10:00 ET
    - cron: '0 0 * * 0'     # Sat 19:00 ET (next day in UTC)
    - cron: '30 14 * * 0'   # Sun 09:30 ET
    - cron: '30 21 * * 0'   # Sun 16:30 ET
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threads-publisher-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      state_ready: ${{ steps.export.outputs.state_ready }}
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            data
            src
            config.json
          sparse-checkout-cone-mode: true
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Determine safe execution mode
        id: mode
        run: |
          python - <<'PYMODE' >> "$GITHUB_OUTPUT"
          import json
          with open("config.json", encoding="utf-8") as f:
              cfg = json.load(f)
          dry = bool(cfg.get("queue", {}).get("dry_run", True))
          dry_ai = bool(cfg.get("queue", {}).get("dry_run_ai", False))
          mode = "dry_run_ai" if dry and dry_ai else ("dry_run" if dry else "live")
          print(f"mode={mode}")
          PYMODE
      - name: Run dry run without credentials
        id: dryrun
        if: steps.mode.outputs.mode == 'dry_run'
        continue-on-error: true
        env:
          TRIGGERING_CRON: ${{ github.event.schedule }}
          PUBLIC_REPO_OWNER: ${{ github.repository_owner }}
          PUBLIC_REPO_NAME: ${{ github.event.repository.name }}
          PUBLIC_REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m src.main --dry-run
      - name: Run AI-enabled dry run with Gemini key only
        id: dryrun_ai
        if: steps.mode.outputs.mode == 'dry_run_ai'
        continue-on-error: true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TRIGGERING_CRON: ${{ github.event.schedule }}
          PUBLIC_REPO_OWNER: ${{ github.repository_owner }}
          PUBLIC_REPO_NAME: ${{ github.event.repository.name }}
          PUBLIC_REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m src.main --dry-run
      - name: Run live publisher with required credentials
        id: live
        if: steps.mode.outputs.mode == 'live'
        continue-on-error: true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TRIGGERING_CRON: ${{ github.event.schedule }}
          PUBLIC_REPO_OWNER: ${{ github.repository_owner }}
          PUBLIC_REPO_NAME: ${{ github.event.repository.name }}
          PUBLIC_REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m src.main
      - name: Export non-secret state artifact
        id: export
        if: always()
        run: |
          set +x
          if [ -f data/posting_history.json ]; then
            mkdir -p /tmp/publisher-state
            cp data/posting_history.json /tmp/publisher-state/posting_history.json
            echo "state_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "state_ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Upload state artifact for isolated commit job
        if: always() && steps.export.outputs.state_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publisher-state
          path: /tmp/publisher-state/posting_history.json
          if-no-files-found: error
          retention-days: 1
      - name: Report publisher result
        if: steps.dryrun.outcome == 'failure' || steps.dryrun_ai.outcome == 'failure' || steps.live.outcome == 'failure'
        run: echo "Publisher reported failure. Sensitive details are intentionally omitted; inspect safe category logs and state." && exit 1

  persist-state:
    if: always() && needs.publish.outputs.state_ready == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout latest default branch without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            data
            src
            config.json
          sparse-checkout-cone-mode: true
      - name: Download state artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: publisher-state
          path: /tmp/publisher-state
      - name: Validate and persist state, delete only confirmed videos
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STATE_ARTIFACT_DIR: /tmp/publisher-state
        run: python -m src.commit_state
